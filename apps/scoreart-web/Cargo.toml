[package]
name = "scoreart-web"
description = "ScoreArt in the browser (eframe web runner, WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "scoreart-web"
path = "src/main.rs"

[dependencies]
scoreart-engine = { workspace = true }
scoreart-ui-egui = { workspace = true }
scoreart-synth = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "MessageEvent", "UrlSearchParams", "CssStyleDeclaration", "AudioContext", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "AudioContextState", "Response", "Navigator", "Storage"] }
