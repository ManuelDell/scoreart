[package]
name = "scoreart-synth"
description = "ScoreArt's sound engine: a mixer with the built-in synthesizer, SoundFont and SFZ sample playback"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
scoreart-model = { workspace = true }
scoreart-midi = { workspace = true }
rustysynth = { workspace = true }
claxon = { workspace = true }
zip = { workspace = true }
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }

[features]
# Downloading libraries from the catalogue (desktop and command line; not in the browser).
download = ["dep:ureq"]
